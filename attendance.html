<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Agents Attendance Tracking</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }
        
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            align-items: center;
            flex-wrap: wrap;
        }
        .filters-bar input, .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .filters-bar input { flex: 1; min-width: 180px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background-color: #0f2537; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 13px; vertical-align: middle; }

        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .btn-save { background-color: #10b981; color: white; }
        .btn:hover { opacity: 0.9; }

        .select-status {
            background: var(--bg-dark);
            color: white;
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 6px;
        }
        .extra-time-container {
            display: none;
            margin-top: 6px;
            align-items: center;
            gap: 5px;
        }
        .extra-time-container input {
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: #38bdf8;
            padding: 4px;
            border-radius: 4px;
            width: 80px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Navbar -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">📊 Dashboard</a>
                <a href="agents.html" class="nav-link">👥 Agents Production & Ranking</a>
                <a href="attendance.html" class="nav-link active">📅 Attendance Tracker</a>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">Daily Attendance & Advanced Status Tracker</div>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <select id="monthFilter" style="font-weight: bold; color: var(--accent);">
                <option value="2026-09" selected>📅 September 2026</option>
                <option value="2026-10">📅 October 2026</option>
                <option value="2026-11">📅 November 2026</option>
                <option value="2026-12">📅 December 2026</option>
                <option value="2027-01">📅 January 2027</option>
            </select>

            <input type="date" id="attendanceDate" style="color: var(--accent); font-weight: bold;">

            <input type="text" id="searchInput" placeholder="Search agent for attendance...">
            
            <select id="teamFilter">
                <option value="">All Teams</option>
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Wazowski#3">Wazowski#3</option>
                <option value="Midblue">Midblue</option>
                <option value="Prime">Prime</option>
                <option value="Sunny">Sunny</option>
                <option value="Unity">Unity</option>
                <option value="PGX">PGX</option>
                <option value="MLA">MLA</option>
                <option value="Bloom">Bloom</option>
                <option value="Epic">Epic</option>
                <option value="Peak">Peak</option>
            </select>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Team</th>
                    <th>Attendance Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody">
                <tr><td colspan="4" style="text-align: center;">Select filters to load attendance data...</td></tr>
            </tbody>
        </table>
    </div>

</body>
</html>
