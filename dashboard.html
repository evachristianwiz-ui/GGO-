<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Dashboard & Rankings</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 13px;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }
        .logout-btn {
            background-color: #ef4444 !important;
            color: white !important;
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }

        /* Stats Cards Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        /* Content Section */
        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
        }
        .content-card h2 {
            font-size: 16px;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Table Design */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background-color: #0f2537; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 13px; vertical-align: middle; }
    </style>
</head>
<body>

    <!-- حماية الكود والتحقق من تسجيل الدخول -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole');
            
            // لو مش مسجل دخول، حوله لصفحة الـ Login فوراً
            if (!userRole) {
                window.location.href = 'login.html';
                return;
            }

            // لو اليوزر مانيدجر، نظهر له اللينكات الخاصة بالصلاحيات الكاملة
            if (userRole === 'manager') {
                const managerLinks = document.querySelectorAll('.manager-only');
                managerLinks.forEach(link => link.style.display = 'inline-block');
            }
        });

        // دالة تسجيل الخروج
        function handleLogout() {
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        }
    </script>

    <div class="container">
        <!-- Main Navbar -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img">
            </div>
            <div class="nav-links" id="navLinksContainer">
                <a href="index.html" class="nav-link active">📊 Dashboard & Ranking</a>
                
                <!-- صفحات خاصة بالـ Managers فقط (مخفية تلقائياً عن الأージェنتات) -->
                <a href="agents.html" class="nav-link manager-only" style="display: none;">👥 Agents Production</a>
                <a href="attendance.html" class="nav-link manager-only" style="display: none;">📅 Attendance</a>
                
                <!-- زر تسجيل الخروج -->
                <a href="#" onclick="handleLogout()" class="nav-link logout-btn">🔒 Logout</a>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">Performance Dashboard & General Rankings</div>
        </div>

        <!-- Quick Stats Metrics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Production / Score</h3>
                <div class="value" id="totalProduction">--</div>
            </div>
            <div class="stat-card">
                <h3>Active Agents</h3>
                <div class="value" id="activeAgentsCount">--</div>
            </div>
            <div class="stat-card">
                <h3>Top Team</h3>
                <div class="value" id="topTeamName">--</div>
            </div>
        </div>

        <!-- General Ranking Table -->
        <div class="content-card">
            <h2>Live Performance & Rankings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Agent Name</th>
                        <th>Team</th>
                        <th>Metrics / Score</th>
                    </tr>
                </thead>
                <tbody id="dashboardRankingBody">
                    <tr><td colspan="4" style="text-align: center;">Loading ranking data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
