<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Operations CRM</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --active-bg: #d1fae5;
            --active-text: #065f46;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }
        .nav-buttons, .actions-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: #0077b6;
        }
        .btn-accent {
            background-color: var(--accent);
            color: var(--bg-dark);
        }
        .btn-success {
            background-color: #10b981;
            color: white;
        }
        .btn-edit {
            background-color: #3b82f6;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-notes {
            background-color: #8b5cf6;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* KPI Cards */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .kpi-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-main);
        }
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        .filters-bar input, .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .filters-bar input {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }
        th {
            background-color: #0f2537;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
        }
        td {
            font-size: 14px;
        }
        .status-active {
            background-color: var(--active-bg);
            color: var(--active-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-content label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-top: 8px;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            margin-bottom: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .history-item {
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 5px;
            font-weight: bold;
        }
        .history-text {
            font-size: 13px;
            color: var(--text-main);
            white-space: pre-wrap;
        }
        .badge-probation {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .badge-note {
            background: rgba(0, 180, 216, 0.2);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Nav -->
        <div class="top-nav">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Gulf Global Outsourcing Logo" class="logo-img">
            </div>
            <div class="nav-buttons">
                <button class="btn btn-success" onclick="exportToExcel()">📥 Export Excel</button>
                <button class="btn btn-accent" onclick="openModal()">+ Add Agent</button>
            </div>
        </div>

        <!-- KPI Insights Cards -->
        <div class="kpi-container">
            <div class="kpi-card">
                <span class="kpi-title">Total Agents</span>
                <span class="kpi-value" id="kpiTotal">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Achieved (≥ 0.85)</span>
                <span class="kpi-value" id="kpiAchieved" style="color: #4ade80;">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Below Target (< 0.85)</span>
                <span class="kpi-value" id="kpiBelow" style="color: #f87171;">0</span>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Search agent by name..." onkeyup="filterTable()">
            <select id="teamFilter" onchange="filterTable()">
                <option value="">All Teams</option>
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Wazowski#3">Wazowski#3</option>
                <option value="Midblue. Prime">Midblue. Prime</option>
                <option value="Sunny">Sunny</option>
                <option value="Unity">Unity</option>
                <option value="PGX">PGX</option>
                <option value="MLA">MLA</option>
                <option value="Bloom">Bloom</option>
                <option value="Epic">Epic</option>
                <option value="Peak">Peak</option>
            </select>
            <select id="statusFilter" onchange="filterTable()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="On Break">On Break</option>
            </select>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Team</th>
                    <th>PPO</th>
                    <th>CGM</th>
                    <th>Total G2G's</th>
                    <th>FT/PT</th>
                    <th>Attended</th>
                    <th>Transfers</th>
                    <th>Ratio</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="crmTableBody">
                <tr>
                    <td colspan="11" style="text-align: center; color: var(--text-muted);">Syncing live data from cloud...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add / Edit Agent Modal -->
    <div id="agentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top: 0; color: var(--accent);">Add New Agent Production</h3>
            <input type="hidden" id="editAgentId">
            
            <label>Agent Name</label>
            <input type="text" id="addName" placeholder="Enter Full Name">

            <label>Team</label>
            <select id="addTeam">
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Wazowski#3">Wazowski#3</option>
                <option value="Midblue. Prime">Midblue. Prime</option>
                <option value="Sunny">Sunny</option>
                <option value="Unity">Unity</option>
                <option value="PGX">PGX</option>
                <option value="MLA">MLA</option>
                <option value="Bloom">Bloom</option>
                <option value="Epic">Epic</option>
                <option value="Peak">Peak</option>
            </select>

            <label>PPO</label>
            <input type="number" id="addPpo" placeholder="0" step="any">

            <label>CGM</label>
            <input type="number" id="addCgm" placeholder="0" step="any">

            <label>Total G2G's</label>
            <input type="number" id="addG2gs" placeholder="0" step="any">

            <label>FT / PT</label>
            <select id="addType">
                <option value="FT">FT</option>
                <option value="PT">PT</option>
            </select>

            <label>Attended Days (Allows decimals like 1.5)</label>
            <input type="number" id="addAttended" placeholder="e.g. 1.5" step="0.1">

            <label>Transfers</label>
            <input type="number" id="addTransfers" placeholder="0">

            <label>Status</label>
            <select id="addStatus">
                <option value="Active">Active</option>
                <option value="On Break">On Break</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-accent" style="flex:1;" onclick="saveAgentData()">Save Agent</button>
                <button class="btn" style="flex:1; background:#334155;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Notes & Probation History Modal -->
    <div id="notesModal" class="modal">
        <div class="modal-content" style="width: 550px;">
            <h3 id="notesModalTitle" style="margin-top: 0; color: var(--accent);">Agent Notes & Probation History</h3>
            <input type="hidden" id="notesAgentId">

            <div style="background: rgba(0, 180, 216, 0.05); border: 1px solid var(--card-border); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 10px 0; font-size: 14px; color: var(--accent);">Add New Entry / Probation</h4>
                
                <label>Entry Type</label>
                <select id="noteType" onchange="toggleProbationFields()">
                    <option value="Note">General Note</option>
                    <option value="Probation">Probation Period</option>
                </select>

                <div id="probationFields" style="display: none;">
                    <label>Probation Start Date</label>
                    <input type="date" id="probStart">

                    <label>Probation End Date</label>
                    <input type="date" id="probEnd">
                </div>

                <label>Comment / Details</label>
                <textarea id="noteText" rows="3" placeholder="Write details here..."></textarea>

                <button class="btn btn-accent" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveAgentNote()">Add to History</button>
            </div>

            <h4 style="margin: 0 0 10px 0; font-size: 14px; color: var(--text-muted);">Historical Log</h4>
            <div id="historyList" style="max-height: 250px; overflow-y: auto;">
                <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">No history records yet.</div>
            </div>

            <div style="margin-top: 15px; text-align: right;">
                <button class="btn" style="background:#334155; width: 100%; justify-content: center;" onclick="closeNotesModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase Script Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a",
            measurementId: "G-5LNSFZXGX5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openModal = function() {
            document.getElementById('modalTitle').innerText = "Add New Agent Production";
            document.getElementById('editAgentId').value = "";
            document.getElementById('addName').value = "";
            document.getElementById('addPpo').value = "";
            document.getElementById('addCgm').value = "";
            document.getElementById('addG2gs').value = "";
            document.getElementById('addAttended').value = "";
            document.getElementById('addTransfers').value = "";
            document.getElementById('agentModal').style.display = 'flex';
        }

        window.closeModal = function() { 
            document.getElementById('agentModal').style.display = 'none'; 
        }

        window.editAgent = function(id, name, team, ppo, cgm, g2gs, type, attended, transfers, status) {
            document.getElementById('modalTitle').innerText = "Edit Agent Production";
            document.getElementById('editAgentId').value = id;
            document.getElementById('addName').value = name;
            document.getElementById('addTeam').value = team;
            document.getElementById('addPpo').value = ppo;
            document.getElementById('addCgm').value = cgm;
            document.getElementById('addG2gs').value = g2gs;
            document.getElementById('addType').value = type;
            document.getElementById('addAttended').value = attended;
            document.getElementById('addTransfers').value = transfers;
            document.getElementById('addStatus').value = status;
            document.getElementById('agentModal').style.display = 'flex';
        }

        // Notes & History Modal Functions
        window.openNotesModal = function(id, name) {
            document.getElementById('notesAgentId').value = id;
            document.getElementById('notesModalTitle').innerText = `Notes & History: ${name}`;
            document.getElementById('noteText').value = "";
            document.getElementById('probStart').value = "";
            document.getElementById('probEnd').value = "";
            document.getElementById('noteType').value = "Note";
            toggleProbationFields();

            const agent = allAgents.find(a => a.id === id);
            renderHistoryList(agent ? agent.history : []);
            document.getElementById('notesModal').style.display = 'flex';
        }

        window.closeNotesModal = function() {
            document.getElementById('notesModal').style.display = 'none';
        }

        window.toggleProbationFields = function() {
            const type = document.getElementById('noteType').value;
            const probFields = document.getElementById('probationFields');
            probFields.style.display = (type === 'Probation') ? 'block' : 'none';
        }

        window.saveAgentNote = async function() {
            const id = document.getElementById('notesAgentId').value;
            const type = document.getElementById('noteType').value;
            const text = document.getElementById('noteText').value;
            const start = document.getElementById('probStart').value;
            const end = document.getElementById('probEnd').value;

            if(!text && type === 'Note') {
                alert("Please write a comment.");
                return;
            }

            let entryDetails = text;
            if(type === 'Probation') {
                if(!start || !end) {
                    alert("Please specify start and end dates for probation.");
                    return;
                }
                entryDetails = `[Probation Period] From: ${start} To: ${end}\nDetails: ${text}`;
            }

            const newEntry = {
                type: type,
                details: entryDetails,
                date: new Date().toISOString().split('T')[0]
            };

            const agent = allAgents.find(a => a.id === id);
            let history = agent.history ? [...agent.history] : [];
            history.unshift(newEntry); // Add to top of history

            try {
                await updateDoc(doc(db, "agents_data", id), { history: history });
                document.getElementById('noteText').value = "";
                document.getElementById('probStart').value = "";
                document.getElementById('probEnd').value = "";
                renderHistoryList(history);
            } catch(e) {
                console.error(e);
                alert("Error saving note: " + e.message);
            }
        }

        window.renderHistoryList = function(history) {
            const container = document.getElementById('historyList');
            if(!history || history.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">No history records yet.</div>`;
                return;
            }
            let html = "";
            history.forEach(item => {
                const badgeClass = item.type === 'Probation' ? 'badge-probation' : 'badge-note';
                html += `<div class="history-item">
                    <div class="history-header">
                        <span>📅 ${item.date}</span>
                        <span class="${badgeClass}">${item.type}</span>
                    </div>
                    <div class="history-text">${item.details}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.saveAgentData = async function() {
            const id = document.getElementById('editAgentId').value;
            const name = document.getElementById('addName').value;
            if(!name) { alert("Please enter agent name"); return; }

            const g2gs = Number(document.getElementById('addG2gs').value) || 0;
            const attended = Number(document.getElementById('addAttended').value) || 0;
            const ratio = attended > 0 ? (g2gs / attended) : 0;

            const agentData = {
                name: name,
                team: document.getElementById('addTeam').value,
                ppo: Number(document.getElementById('addPpo').value) || 0,
                cgm: Number(document.getElementById('addCgm').value) || 0,
                g2gs: g2gs,
                type: document.getElementById('addType').value,
                attended: attended,
                transfers: Number(document.getElementById('addTransfers').value) || 0,
                ratio: Number(ratio.toFixed(2)),
                status: document.getElementById('addStatus').value,
                updatedAt: serverTimestamp()
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "agents_data", id), agentData);
                } else {
                    agentData.createdAt = serverTimestamp();
                    agentData.history = []; // Initialize empty history for new agent
                    await addDoc(collection(db, "agents_data"), agentData);
                }
                closeModal();
            } catch(e) {
                console.error(e);
                alert("Error saving data: " + e.message);
            }
        }

        window.deleteAgent = async function(id) {
            if(confirm("Are you sure you want to delete this agent?")) {
                try {
                    await deleteDoc(doc(db, "agents_data", id));
                } catch(e) {
                    console.error(e);
                    alert("Error deleting agent");
                }
            }
        }

        let allAgents = [];
        const tbody = document.getElementById('crmTableBody');

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            allAgents = [];
            snapshot.forEach((docSnap) => {
                allAgents.push({ id: docSnap.id, ...docSnap.data() });
            });
            updateKPIs(allAgents);
            renderTable(allAgents);
        }, (error) => {
            console.error("Error listening to changes:", error);
        });

        window.updateKPIs = function(data) {
            const total = data.length;
            let achieved = 0;
            let below = 0;

            data.forEach(item => {
                const ratioVal = item.ratio !== undefined ? item.ratio : (item.attended > 0 ? (item.g2gs / item.attended) : 0);
                if (ratioVal >= 0.85) {
                    achieved++;
                } else {
                    below++;
                }
            });

            document.getElementById('kpiTotal').innerText = total;
            document.getElementById('kpiAchieved').innerText = achieved;
            document.getElementById('kpiBelow').innerText = below;
        }

        window.renderTable = function(data) {
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: var(--text-muted);">No records found. Click "+ Add Agent" to start!</td></tr>`;
                return;
            }
            let html = "";
            data.forEach(item => {
                const ratioVal = item.ratio !== undefined ? item.ratio : (item.attended > 0 ? (item.g2gs / item.attended) : 0);
                const ratioColor = ratioVal < 0.85 ? '#f87171' : '#4ade80';

                html += `<tr>
                    <td style="font-weight: bold;">${item.name}</td>
                    <td><span style="background: #1e3e62; padding: 3px 8px; border-radius: 4px; font-size: 11px;">${item.team}</span></td>
                    <td>${item.ppo}</td>
                    <td>${item.cgm}</td>
                    <td style="color: #00b4d8; font-weight: bold;">${item.g2gs}</td>
                    <td><span style="color: #94a3b8;">${item.type}</span></td>
                    <td>${item.attended}</td>
                    <td>${item.transfers}</td>
                    <td><span style="color: ${ratioColor}; font-weight: bold; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px;">${ratioVal.toFixed(2)}</span></td>
                    <td><span class="status-active">${item.status}</span></td>
                    <td style="display: flex; gap: 6px;">
                        <button class="btn btn-notes" onclick="openNotesModal('${item.id}', '${item.name.replace(/'/g, "\\'")}')">💬 Notes</button>
                        <button class="btn btn-edit" onclick="editAgent('${item.id}', '${item.name.replace(/'/g, "\\'")}', '${item.team}', ${item.ppo}, ${item.cgm}, ${item.g2gs}, '${item.type}', ${item.attended}, ${item.transfers}, '${item.status}')">✏️ Edit</button>
                        <button class="btn btn-danger" onclick="deleteAgent('${item.id}')">🗑️ Delete</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.filterTable = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const team = document.getElementById('teamFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = allAgents.filter(item => {
                const matchName = item.name.toLowerCase().includes(search);
                const matchTeam = team === "" || item.team === team;
                const matchStatus = status === "" || item.status === status;
                return matchName && matchTeam && matchStatus;
            });
            renderTable(filtered);
        }

        window.exportToExcel = function() {
            if(allAgents.length === 0) {
                alert("No data available to export.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Agent Name,Team,PPO,CGM,Total G2Gs,Type,Attended Days,Transfers,Ratio,Status\r\n";

            allAgents.forEach(item => {
                const ratioVal = item.ratio !== undefined ? item.ratio : (item.attended > 0 ? (item.g2gs / item.attended) : 0);
                let row = `"${item.name}","${item.team}",${item.ppo},${item.cgm},${item.g2gs},"${item.type}",${item.attended},${item.transfers},${ratioVal.toFixed(2)},"${item.status}"`;
                csvContent += row + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "GGO_CRM_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
