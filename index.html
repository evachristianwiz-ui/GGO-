<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Live Dashboard & Summary</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }

        /* KPI Cards */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .kpi-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .kpi-value { font-size: 26px; font-weight: bold; color: var(--text-main); }

        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            align-items: center;
        }
        .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-weight: bold;
            color: var(--accent);
        }

        /* Table Container */
        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background-color: #0f2537; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 13px; }

        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-accent { background-color: var(--accent); color: var(--bg-dark); }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navbar -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">📊 Dashboard</a>
                <a href="agents.html" class="nav-link">👥 Agents Production</a>
                <a href="floor.html" class="nav-link">📋 Day-to-Day Floor</a>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">GGO Executive Live Dashboard</div>
            <button class="btn btn-accent" onclick="copyDashboardWhatsApp()">💬 Copy Summary for WhatsApp</button>
        </div>

        <!-- Month Filter -->
        <div class="filters-bar">
            <select id="dashMonthFilter" onchange="processDashboardData()">
                <option value="2026-09" selected>📅 September 2026</option>
                <option value="2026-10">📅 October 2026</option>
            </select>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-container">
            <div class="kpi-card">
                <span class="kpi-title">Active Agents 👥</span>
                <span class="kpi-value" id="dashTotalAgents">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Total G2Gs 🏆</span>
                <span class="kpi-value" id="dashTotalG2gs" style="color: #4ade80;">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Total MLA G2Gs 🔷</span>
                <span class="kpi-value" id="dashTotalMlaG2gs" style="color: var(--accent);">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Total Transfers 🔄</span>
                <span class="kpi-value" id="dashTotalTransfers">0</span>
            </div>
        </div>

        <!-- Teams Summary Table -->
        <div class="table-card">
            <h3 style="margin-top: 0; color: var(--accent); font-size: 15px; margin-bottom: 15px;">Teams Breakdown Summary</h3>
            <table>
                <thead>
                    <tr>
                        <th>Team Name</th>
                        <th>Active Agents</th>
                        <th>Total G2Gs</th>
                        <th>MLA G2Gs</th>
                        <th>Transfers</th>
                        <th>MLA Transfers</th>
                        <th>Avg G2G Ratio</th>
                    </tr>
                </thead>
                <tbody id="dashTableBody">
                    <tr><td colspan="7" style="text-align: center;">Loading live metrics...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalAgents = [];
        const teamNamesList = [
            "Wazowski 1", "Wazowski 2", "Wazowski 3", 
            "Midblue", "Prime", "Sunny", "Bloom", 
            "Epic", "Peak", "Unity", "PGX", "MLA"
        ];

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            globalAgents = [];
            snapshot.forEach(docSnap => globalAgents.push({ id: docSnap.id, ...docSnap.data() }));
            processDashboardData();
        });

        window.processDashboardData = function() {
            const selectedMonth = document.getElementById('dashMonthFilter').value;
            
            // Filter by selected month & active status (excluding Resigned / Terminated)
            const filtered = globalAgents.filter(item => {
                const matchesMonth = (item.month || "2026-09") === selectedMonth;
                const st = item.status;
                const isActive = !st || st === 'Active' || st === 'New Comer' || st === 'On Probation' || st === 'Two Weeks Notice';
                return matchesMonth && isActive;
            });

            let sumAgents = filtered.length;
            let sumG2gs = 0;
            let sumMlaG2gs = 0;
            let sumTransfers = 0;

            filtered.forEach(a => {
                sumG2gs += Number(a.g2gs) || 0;
                sumMlaG2gs += Number(a.mlaG2gs) || 0;
                sumTransfers += Number(a.transfers) || 0;
            });

            document.getElementById('dashTotalAgents').innerText = sumAgents;
            document.getElementById('dashTotalG2gs').innerText = sumG2gs;
            document.getElementById('dashTotalMlaG2gs').innerText = sumMlaG2gs;
            document.getElementById('dashTotalTransfers').innerText = sumTransfers;

            // Build teams summary table
            let tableHtml = "";
            teamNamesList.forEach(tName => {
                const teamAgents = filtered.filter(a => a.team === tName);
                const tAgentsCount = teamAgents.length;
                
                let tG2gs = 0;
                let tMlaG2gs = 0;
                let tTrans = 0;
                let tMlaTrans = 0;
                let totalRatioSum = 0;

                teamAgents.forEach(a => {
                    tG2gs += Number(a.g2gs) || 0;
                    tMlaG2gs += Number(a.mlaG2gs) || 0;
                    tTrans += Number(a.transfers) || 0;
                    tMlaTrans += Number(a.mlaTransfers) || 0;

                    const att = Number(a.attended) > 0 ? Number(a.attended) : 1;
                    totalRatioSum += (Number(a.g2gs) || 0) / att;
                });

                const avgRatio = tAgentsCount > 0 ? (totalRatioSum / tAgentsCount).toFixed(2) : "0.00";

                tableHtml += `<tr>
                    <td><b>${tName}</b></td>
                    <td>${tAgentsCount}</td>
                    <td style="color: #4ade80;"><b>${tG2gs}</b></td>
                    <td style="color: var(--accent); font-weight: bold;">${tMlaG2gs}</td>
                    <td>${tTrans}</td>
                    <td style="color: var(--accent); font-weight: bold;">${tMlaTrans}</td>
                    <td><b style="color: ${avgRatio >= 0.85 ? '#34d399' : '#f87171'};">${avgRatio}</b></td>
                </tr>`;
            });

            document.getElementById('dashTableBody').innerHTML = tableHtml;
        }

        window.copyDashboardWhatsApp = function() {
            let text = `📊 *GGO Executive Summary Update*\n`;
            text += `• *Active Agents:* ${document.getElementById('dashTotalAgents').innerText}\n`;
            text += `• *Total G2Gs:* ${document.getElementById('dashTotalG2gs').innerText}\n`;
            text += `• *Total MLA G2Gs:* ${document.getElementById('dashTotalMlaG2gs').innerText}\n`;
            text += `• *Total Transfers:* ${document.getElementById('dashTotalTransfers').innerText}\n\n`;

            const selectedMonth = document.getElementById('dashMonthFilter').value;
            const filtered = globalAgents.filter(item => {
                const matchesMonth = (item.month || "2026-09") === selectedMonth;
                const st = item.status;
                const isActive = !st || st === 'Active' || st === 'New Comer' || st === 'On Probation' || st === 'Two Weeks Notice';
                return matchesMonth && isActive;
            });

            teamNamesList.forEach(tName => {
                const teamAgents = filtered.filter(a => a.team === tName);
                if(teamAgents.length > 0) {
                    let g2g = teamAgents.reduce((s, a) => s + (Number(a.g2gs) || 0), 0);
                    let mla = teamAgents.reduce((s, a) => s + (Number(a.mlaG2gs) || 0), 0);
                    text += `🔹 *${tName}* ➔ G2Gs: ${g2g} | MLA: ${mla}\n`;
                }
            });

            navigator.clipboard.writeText(text);
            alert("✅ Dashboard summary copied to clipboard for WhatsApp!");
        }
    </script>
</body>
</html>
