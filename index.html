<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO CRM - Dashboard</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1350px; margin: 0 auto; }
        
        /* Navbar الموحد للتنقل بين الصفحات */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }
        .logo-img { height: 40px; width: auto; object-fit: contain; }

        /* Dashboard Cards */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: 12px;
        }
        .card h3 { margin-top: 0; color: var(--accent); font-size: 16px; }
        .stat-num { font-size: 32px; font-weight: bold; margin-top: 10px; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <div class="main-navbar">
            <img src="GGO-White-Var2.png" alt="Logo" class="logo-img">
            <div class="nav-links">
                <a href="index.html" class="nav-link active">📊 Dashboard</a>
                <a href="agents.html" class="nav-link">👥 Agents Production & Ranking</a>
                <a href="#" class="nav-link" style="opacity: 0.5; cursor: not-allowed;">📅 Attendance (Soon)</a>
            </div>
        </div>

        <!-- Dashboard Content -->
        <h2 style="color: var(--text-main); margin-bottom: 20px;">Operations Overview</h2>
        <div class="grid-cards">
            <div class="card">
                <h3>Total Active Agents</h3>
                <div class="stat-num" id="dashTotalAgents">0</div>
            </div>
            <div class="card">
                <h3>Total G2Gs This Month</h3>
                <div class="stat-num" id="dashTotalG2gs" style="color: #4ade80;">0</div>
            </div>
            <div class="card">
                <h3>Total Transfers</h3>
                <div class="stat-num" id="dashTotalTransfers" style="color: #38bdf8;">0</div>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            let totalAgents = 0;
            let totalG2gs = 0;
            let totalTransfers = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                totalAgents++;
                totalG2gs += Number(data.g2gs || 0);
                totalTransfers += Number(data.transfers || 0);
            });

            document.getElementById('dashTotalAgents').innerText = totalAgents;
            document.getElementById('dashTotalG2gs').innerText = totalG2gs;
            document.getElementById('dashTotalTransfers').innerText = totalTransfers;
        });
    </script>
</body>
</html>
