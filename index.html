<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Operations CRM</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --active-bg: #d1fae5;
            --active-text: #065f46;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            height: 45px; /* طول اللوجو مظبوط ومناسب للهيدر */
            width: auto;
            object-fit: contain;
        }
        .nav-buttons, .actions-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: #0077b6;
        }
        .btn-accent {
            background-color: var(--accent);
            color: var(--bg-dark);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        .filters-bar input, .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .filters-bar input {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }
        th {
            background-color: #0f2537;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
        }
        td {
            font-size: 14px;
        }
        .status-active {
            background-color: var(--active-bg);
            color: var(--active-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 400px;
            border: 1px solid var(--card-border);
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Nav -->
        <div class="top-nav">
            <div class="logo-area">
                <!-- هنا بيتم عرض اللوجو مباشرة من الملف المرفوع -->
                <img src="GGO-White-Var2.png" alt="Gulf Global Outsourcing Logo" class="logo-img">
                <div>
                    <div style="font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px;">ORT & CGM Command Center</div>
                </div>
            </div>
            <div class="nav-buttons">
                <button class="btn">📊 Dashboard</button>
                <button class="btn btn-primary">👥 Agent Directory</button>
                <button class="btn">📁 Hosting Guide</button>
            </div>
            <button class="btn btn-accent" onclick="openModal()">+ Add Agent</button>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Search agent by name..." onkeyup="filterTable()">
            <select id="teamFilter" onchange="filterTable()">
                <option value="">All Teams</option>
                <option value="ORT">ORT</option>
                <option value="CGM">CGM</option>
            </select>
            <select id="statusFilter" onchange="filterTable()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="On Break">On Break</option>
            </select>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Team</th>
                    <th>PPO</th>
                    <th>CGM</th>
                    <th>RPM</th>
                    <th>Total G2G's</th>
                    <th>FT/PT</th>
                    <th>Attended</th>
                    <th>Transfers</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="crmTableBody">
                <tr>
                    <td colspan="10" style="text-align: center; color: var(--text-muted);">Syncing live data from cloud...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add Agent Modal -->
    <div id="agentModal" class="modal">
        <div class="modal-content">
            <h3>Add New Agent Production</h3>
            <input type="text" id="addName" placeholder="Agent Name">
            <select id="addTeam">
                <option value="ORT">ORT</option>
                <option value="CGM">CGM</option>
            </select>
            <input type="number" id="addPpo" placeholder="PPO">
            <input type="number" id="addCgm" placeholder="CGM">
            <input type="number" id="addRpm" placeholder="RPM">
            <input type="number" id="addG2gs" placeholder="Total G2G's">
            <select id="addType">
                <option value="FT">FT</option>
                <option value="PT">PT</option>
            </select>
            <input type="number" id="addAttended" placeholder="Attended">
            <input type="number" id="addTransfers" placeholder="Transfers">
            <select id="addStatus">
                <option value="Active">Active</option>
                <option value="On Break">On Break</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-accent" style="flex:1;" onclick="saveNewAgent()">Save</button>
                <button class="btn" style="flex:1;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase Script Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a",
            measurementId: "G-5LNSFZXGX5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openModal = function() { document.getElementById('agentModal').style.display = 'flex'; }
        window.closeModal = function() { document.getElementById('agentModal').style.display = 'none'; }

        window.saveNewAgent = async function() {
            const name = document.getElementById('addName').value;
            if(!name) { alert("Please enter name"); return; }

            try {
                await addDoc(collection(db, "agents_data"), {
                    name: name,
                    team: document.getElementById('addTeam').value,
                    ppo: Number(document.getElementById('addPpo').value) || 0,
                    cgm: Number(document.getElementById('addCgm').value) || 0,
                    rpm: Number(document.getElementById('addRpm').value) || 0,
                    g2gs: Number(document.getElementById('addG2gs').value) || 0,
                    type: document.getElementById('addType').value,
                    attended: Number(document.getElementById('addAttended').value) || 0,
                    transfers: Number(document.getElementById('addTransfers').value) || 0,
                    status: document.getElementById('addStatus').value,
                    createdAt: serverTimestamp()
                });
                closeModal();
                document.getElementById('addName').value = '';
            } catch(e) {
                console.error(e);
                alert("Error saving data");
            }
        }

        let allAgents = [];
        const tbody = document.getElementById('crmTableBody');

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            allAgents = [];
            snapshot.forEach((doc) => {
                allAgents.push({ id: doc.id, ...doc.data() });
            });
            renderTable(allAgents);
        });

        window.renderTable = function(data) {
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">No records found. Click "+ Add Agent" to start!</td></tr>`;
                return;
            }
            let html = "";
            data.forEach(item => {
                html += `<tr>
                    <td style="font-weight: bold;">${item.name}</td>
                    <td><span style="background: #1e3e62; padding: 3px 8px; border-radius: 4px; font-size: 11px;">${item.team}</span></td>
                    <td>${item.ppo}</td>
                    <td>${item.cgm}</td>
                    <td>${item.rpm}</td>
                    <td style="color: #00b4d8; font-weight: bold;">${item.g2gs}</td>
                    <td><span style="color: #94a3b8;">${item.type}</span></td>
                    <td>${item.attended}</td>
                    <td>${item.transfers}</td>
                    <td><span class="status-active">${item.status}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.filterTable = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const team = document.getElementById('teamFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = allAgents.filter(item => {
                const matchName = item.name.toLowerCase().includes(search);
                const matchTeam = team === "" || item.team === team;
                const matchStatus = status === "" || item.status === status;
                return matchName && matchTeam && matchStatus;
            });
            renderTable(filtered);
        }
    </script>
</body>
</html>
