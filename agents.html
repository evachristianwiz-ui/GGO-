<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Agents Production & Ranking</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1450px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-accent { background-color: var(--accent); color: var(--bg-dark); }
        .btn-edit { background-color: #3b82f6; color: white; padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; }
        .btn-danger { background-color: #ef4444; color: white; padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; }
        .btn:hover { opacity: 0.9; }

        /* KPI Cards */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .kpi-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .kpi-value { font-size: 24px; font-weight: bold; color: var(--text-main); }

        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            align-items: center;
            flex-wrap: wrap;
        }
        .filters-bar input, .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .filters-bar input { flex: 1; min-width: 180px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background-color: #0f2537; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 13px; }
        
        /* Status Badges */
        .status-active { background-color: rgba(16, 185, 129, 0.15); color: #34d399; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .status-newcomer { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .status-resigned { background-color: rgba(234, 179, 8, 0.2); color: #facc15; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .status-terminated { background-color: rgba(100, 116, 139, 0.2); color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 25px; border-radius: 12px; width: 480px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--card-border);
        }
        .modal-content label { font-size: 12px; color: var(--text-muted); display: block; margin-top: 8px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 10px; margin-top: 4px; margin-bottom: 10px; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; box-sizing: border-box;
        }
        .rank-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; margin-right: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Navbar -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">📊 Dashboard</a>
                <a href="agents.html" class="nav-link active">👥 Agents Production & Ranking</a>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">Production per agent & Top Achievers (Cloud Live)</div>
            <div class="nav-buttons">
                <button class="btn btn-accent" onclick="openModal()">+ Add Agent</button>
            </div>
        </div>

        <!-- KPI Insights Cards -->
        <div class="kpi-container">
            <div class="kpi-card">
                <span class="kpi-title">Total Agents 📊</span>
                <span class="kpi-value" id="kpiTotal">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">G2G Achieved (≥ 0.85) 🟢</span>
                <span class="kpi-value" id="kpiG2gAchieved" style="color: #4ade80;">0</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">G2G Below (< 0.85) 🔴</span>
                <span class="kpi-value" id="kpiG2gBelow" style="color: #f87171;">0</span>
            </div>
        </div>

        <!-- Filters & Ranking Bar -->
        <div class="filters-bar">
            <select id="monthFilter" onchange="filterTable()" style="font-weight: bold; color: var(--accent);">
                <option value="2026-09" selected>📅 September 2026</option>
                <option value="2026-10">📅 October 2026</option>
            </select>

            <select id="rankingFilter" onchange="filterTable()" style="font-weight: bold; color: #f59e0b; border-color: #f59e0b;">
                <option value="default">📊 View: Default List</option>
                <option value="rank_g2gs">🏆 Top Achievers: Total G2Gs</option>
                <option value="rank_ratio">🎯 Top Achievers: G2G Ratio</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search agent..." onkeyup="filterTable()">
            
            <select id="teamFilter" onchange="filterTable()">
                <option value="">All Teams</option>
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Midblue">Midblue</option>
                <option value="Prime">Prime</option>
            </select>

            <select id="statusFilter" onchange="filterTable()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="On Probation">On Probation</option>
                <option value="New Comer">New Comer</option>
                <option value="Resigned">Resigned</option>
                <option value="Terminated">Terminated</option>
            </select>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Team</th>
                    <th>Total G2G's</th>
                    <th>FT/PT</th>
                    <th>Attended</th>
                    <th>Transfers</th>
                    <th>Transfers Ratio</th>
                    <th>G2G Ratio</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="crmTableBody">
                <tr><td colspan="10" style="text-align: center;">Loading live data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Add / Edit Modal -->
    <div id="agentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--accent);">Add Agent</h3>
            <input type="hidden" id="editAgentId">
            <label>Agent Name</label>
            <input type="text" id="addName" placeholder="Full name...">
            <label>Team</label>
            <select id="addTeam">
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Midblue">Midblue</option>
                <option value="Prime">Prime</option>
            </select>
            <label>Employment Type</label>
            <select id="addType">
                <option value="FT">FT</option>
                <option value="PT">PT</option>
            </select>
            <label>Status</label>
            <select id="addStatus">
                <option value="Active">Active</option>
                <option value="On Probation">On Probation</option>
                <option value="New Comer">New Comer</option>
                <option value="Resigned">Resigned</option>
                <option value="Terminated">Terminated</option>
            </select>
            <label>Total G2G's</label>
            <input type="number" id="addG2gs" placeholder="0">
            <label>Attended Days</label>
            <input type="number" id="addAttended" step="0.1" placeholder="0">
            <label>Transfers</label>
            <input type="number" id="addTransfers" placeholder="0">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-accent" style="flex:1;" onclick="saveAgentData()">Save</button>
                <button class="btn" style="flex:1;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allAgents = [];

        window.openModal = () => {
            document.getElementById('modalTitle').innerText = "Add Agent";
            document.getElementById('editAgentId').value = "";
            document.getElementById('addName').value = '';
            document.getElementById('addG2gs').value = '';
            document.getElementById('addAttended').value = '';
            document.getElementById('addTransfers').value = '';
            document.getElementById('agentModal').style.display = 'flex';
        }

        window.closeModal = () => { document.getElementById('agentModal').style.display = 'none'; }

        window.editAgent = function(id) {
            const agent = allAgents.find(a => a.id === id);
            if (!agent) return;
            document.getElementById('modalTitle').innerText = "Edit Agent";
            document.getElementById('editAgentId').value = agent.id;
            document.getElementById('addName').value = agent.name || '';
            document.getElementById('addTeam').value = agent.team || 'Wazowski#1';
            document.getElementById('addType').value = agent.type || 'FT';
            document.getElementById('addStatus').value = agent.status || 'Active';
            document.getElementById('addG2gs').value = agent.g2gs || 0;
            document.getElementById('addAttended').value = agent.attended || 0;
            document.getElementById('addTransfers').value = agent.transfers || 0;
            document.getElementById('agentModal').style.display = 'flex';
        }

        window.deleteAgent = async function(id) {
            if(confirm('Are you sure you want to delete this agent?')) {
                try {
                    await deleteDoc(doc(db, "agents_data", id));
                } catch(e) {
                    alert("Error deleting: " + e.message);
                }
            }
        }

        window.saveAgentData = async function() {
            const id = document.getElementById('editAgentId').value;
            const name = document.getElementById('addName').value.trim();
            if(!name) { alert("Please enter agent name"); return; }

            const agentData = {
                name: name,
                month: document.getElementById('monthFilter').value,
                team: document.getElementById('addTeam').value,
                type: document.getElementById('addType').value,
                status: document.getElementById('addStatus').value,
                g2gs: Number(document.getElementById('addG2gs').value) || 0,
                attended: Number(document.getElementById('addAttended').value) || 0,
                transfers: Number(document.getElementById('addTransfers').value) || 0
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "agents_data", id), agentData);
                } else {
                    await addDoc(collection(db, "agents_data"), agentData);
                }
                closeModal();
            } catch(e) {
                alert("Error saving: " + e.message);
            }
        }

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            allAgents = [];
            snapshot.forEach(docSnap => allAgents.push({ id: docSnap.id, ...docSnap.data() }));
            filterTable();
        });

        window.filterTable = function() {
            const selectedMonth = document.getElementById('monthFilter').value;
            const rankingMode = document.getElementById('rankingFilter').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const teamVal = document.getElementById('teamFilter').value;
            const statusVal = document.getElementById('statusFilter').value;
            
            let filtered = allAgents.filter(item => {
                const matchesMonth = (item.month || "2026-09") === selectedMonth;
                const matchesSearch = (item.name || '').toLowerCase().includes(searchVal);
                const matchesTeam = teamVal === "" || item.team === teamVal;
                const matchesStatus = statusVal === "" || item.status === statusVal;
                return matchesMonth && matchesSearch && matchesTeam && matchesStatus;
            });

            if (rankingMode === 'rank_g2gs') {
                filtered.sort((a, b) => (b.g2gs || 0) - (a.g2gs || 0));
            } else if (rankingMode === 'rank_ratio') {
                filtered.sort((a, b) => {
                    const ratioA = (a.attended > 0) ? (a.g2gs / a.attended) : 0;
                    const ratioB = (b.attended > 0) ? (b.g2gs / b.attended) : 0;
                    return ratioB - ratioA;
                });
            }

            // حساب الـ KPIs
            let totalAgents = filtered.length;
            let g2gAchievedCount = 0;
            let g2gBelowCount = 0;

            filtered.forEach(item => {
                const attended = item.attended > 0 ? item.attended : 1;
                const ratio = item.g2gs / attended;
                if (ratio >= 0.85) g2gAchievedCount++;
                else g2gBelowCount++;
            });

            document.getElementById('kpiTotal').innerText = totalAgents;
            document.getElementById('kpiG2gAchieved').innerText = g2gAchievedCount;
            document.getElementById('kpiG2gBelow').innerText = g2gBelowCount;

            let html = "";
            filtered.forEach((item, index) => {
                let rankPrefix = rankingMode !== 'default' ? `<span class="rank-badge">#${index + 1}</span>` : "";
                const attended = item.attended > 0 ? item.attended : 1;
                const g2gRatio = (item.g2gs / attended).toFixed(2);
                const transfersRatio = (item.transfers / attended).toFixed(2);

                let statusBadgeHTML = `<span class="status-active">Active</span>`;
                
                if (item.status === 'On Probation') {
                    statusBadgeHTML = `<span style="background-color: rgba(239, 68, 68, 0.25); color: #ef4444; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid #ef4444;">⚠️ On Probation</span>`;
                } else if (item.status === 'New Comer') {
                    statusBadgeHTML = `<span class="status-newcomer">New Comer</span>`;
                } else if (item.status === 'Resigned') {
                    statusBadgeHTML = `<span class="status-resigned">Resigned</span>`;
                } else if (item.status === 'Terminated') {
                    statusBadgeHTML = `<span class="status-terminated">Terminated</span>`;
                }

                html += `<tr>
                    <td>${rankPrefix}${item.name}</td>
                    <td>${item.team}</td>
                    <td><b>${item.g2gs || 0}</b></td>
                    <td>${item.type || 'FT'}</td>
                    <td>${item.attended || 0}</td>
                    <td>${item.transfers || 0}</td>
                    <td><b style="color: ${transfersRatio >= 2.0 ? '#34d399' : '#f87171'};">${transfersRatio}</b></td>
                    <td><b style="color: ${g2gRatio >= 0.85 ? '#34d399' : '#f87171'};">${g2gRatio}</b></td>
                    <td>${statusBadgeHTML}</td>
                    <td>
                        <button class="btn-status" onclick="editAgent('${item.id}')" style="background-color: #3b82f6; color: white; padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; border: none;">Edit</button>
                        <button class="btn-danger" onclick="deleteAgent('${item.id}')">Delete</button>
                    </td>
                </tr>`;
            });
            document.getElementById('crmTableBody').innerHTML = html || `<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">No records found</td></tr>`;
        }
    </script>
</body>
</html>
