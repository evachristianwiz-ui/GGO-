<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Agents Production & Ranking</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }
        
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            align-items: center;
            flex-wrap: wrap;
        }
        .filters-bar input, .filters-bar select {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .filters-bar input { flex: 1; min-width: 180px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background-color: #0f2537; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        td { font-size: 13px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Navbar -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">📊 Dashboard</a>
                <a href="agents.html" class="nav-link active">👥 Agents Production & Ranking</a>
                <a href="attendance.html" class="nav-link">📅 Attendance Tracker</a>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">Agents Production Management & Rankings</div>
        </div>

        <!-- Filters Bar -->
        <div class="filters-bar">
            <select id="monthFilter" style="font-weight: bold; color: var(--accent);">
                <option value="2026-09" selected>📅 September 2026</option>
                <option value="2026-10">📅 October 2026</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search agent by name...">
            <select id="teamFilter">
                <option value="">All Teams</option>
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Midblue">Midblue</option>
            </select>
        </div>

        <!-- Agents Production Table -->
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Agent Name</th>
                    <th>Team</th>
                    <th>Production / Metrics</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="agentsTableBody">
                <tr>
                    <td>1</td>
                    <td>أحمد محمد</td>
                    <td>Wazowski#1</td>
                    <td>1,450 pts</td>
                    <td><button style="background:var(--accent); border:none; padding:5px 10px; border-radius:5px; color:#070f1e; font-weight:bold; cursor:pointer;">Edit</button></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
