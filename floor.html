<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Day to Day Floor Production</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1700px; margin: 0 auto; }
        
        .main-navbar { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); padding: 12px 25px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 25px; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 8px; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { background-color: var(--accent); color: var(--bg-dark); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--card-border); }
        .date-picker-area { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--accent); }
        .date-picker-area input { background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 6px; }

        .floor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .team-column { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
        .team-header { background: #0f2537; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; color: var(--accent); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .team-badge { background: var(--card-border); padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #facc15; }

        .agent-row { display: grid; grid-template-columns: 2fr 1fr 1.5fr; border-bottom: 1px solid var(--card-border); align-items: center; font-size: 13px; }
        .agent-name { padding: 10px; font-weight: 600; border-right: 1px solid var(--card-border); }
        .agent-val { padding: 10px; text-align: center; font-weight: bold; border-right: 1px solid var(--card-border); }
        .agent-status { padding: 8px; text-align: center; font-size: 11px; font-weight: bold; }

        .status-g2g { background: rgba(16, 185, 129, 0.25); color: #34d399; }
        .status-bad { background: rgba(239, 68, 68, 0.25); color: #f87171; }
        .status-postponed { background: rgba(245, 158, 11, 0.25); color: #fbbf24; }

        .total-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
        .total-box { text-align: center; }
        .total-box h3 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
        .total-box .num { font-size: 28px; font-weight: bold; color: var(--accent); }

        .btn-add-lead { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin: 10px; display: inline-block; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 400px; border: 1px solid var(--card-border); }
        .modal-content label { display: block; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-top: 5px; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">📊 Dashboard</a>
                <a href="agents.html" class="nav-link">👥 Agents Production</a>
                <a href="floor.html" class="nav-link active">📋 Day-to-Day Floor</a>
            </div>
        </div>

        <div class="top-bar">
            <div class="date-picker-area">
                <span>Select Date:</span>
                <input type="date" id="floorDate" onchange="loadFloorData()">
            </div>
            <button class="btn-add-lead" onclick="openLeadModal()">+ Add Floor Entry (Lead)</button>
        </div>

        <!-- Floor Grid per Team -->
        <div class="floor-grid" id="floorGridContainer">
            <!-- Dynamic Teams Grid -->
        </div>

        <!-- Total Production Summary -->
        <div class="total-section">
            <div class="total-box">
                <h3>CGM Total Production</h3>
                <div class="num" id="totalCgmFloor">0</div>
            </div>
            <div class="total-box">
                <h3>MLA Total Production</h3>
                <div class="num" id="totalMlaFloor" style="color: #f59e0b;">0</div>
            </div>
            <div class="total-box">
                <h3>Total Floor Entries</h3>
                <div class="num" id="totalFloorCount">0</div>
            </div>
        </div>
    </div>

    <!-- Add Lead Modal -->
    <div id="leadModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--accent); margin-top:0;">Add Floor Production Entry</h3>
            <label>Agent Name</label>
            <input type="text" id="leadAgentName" placeholder="Agent name...">
            <label>Team</label>
            <select id="leadTeam">
                <option value="Wazowski#1">Wazowski#1</option>
                <option value="Wazowski#2">Wazowski#2</option>
                <option value="Midblue">Midblue</option>
                <option value="Prime">Prime</option>
                <option value="Mla">Mla</option>
            </select>
            <label>Campaign</label>
            <select id="leadCampaign">
                <option value="CGM">CGM</option>
                <option value="MLA">MLA</option>
            </select>
            <label>Value / Count (e.g., 1, 2...)</label>
            <input type="number" id="leadValue" value="1">
            <label>Status</label>
            <select id="leadStatus">
                <option value="G2G">G2G 🟢</option>
                <option value="Bad">Bad 🔴</option>
                <option value="Postponed">Postponed 🟡</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-add-lead" style="flex:1; margin:0;" onclick="saveFloorLead()">Save</button>
                <button class="btn-add-lead" style="flex:1; margin:0; background:var(--card-border);" onclick="closeLeadModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default date to today
        document.getElementById('floorDate').valueAsDate = new Date();

        window.openLeadModal = () => { document.getElementById('leadModal').style.display = 'flex'; }
        window.closeLeadModal = () => { document.getElementById('leadModal').style.display = 'none'; }

        window.saveFloorLead = async function() {
            const date = document.getElementById('floorDate').value;
            const name = document.getElementById('leadAgentName').value.trim();
            const team = document.getElementById('leadTeam').value;
            const campaign = document.getElementById('leadCampaign').value;
            const val = Number(document.getElementById('leadValue').value) || 0;
            const status = document.getElementById('leadStatus').value;

            if(!name) { alert("Please enter agent name"); return; }

            try {
                await addDoc(collection(db, "floor_production"), { date, name, team, campaign, val, status });
                closeLeadModal();
                loadFloorData();
            } catch(e) {
                alert("Error saving: " + e.message);
            }
        }

        window.loadFloorData = function() {
            const selectedDate = document.getElementById('floorDate').value;
            
            onSnapshot(collection(db, "floor_production"), (snapshot) => {
                let entries = [];
                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    if(data.date === selectedDate) {
                        entries.push({ id: docSnap.id, ...data });
                    }
                });

                renderFloor(entries);
            });
        }

        function renderFloor(entries) {
            let teamsMap = {};
            let cgmTotal = 0;
            let mlaTotal = 0;

            entries.forEach(item => {
                if(!teamsMap[item.team]) teamsMap[item.team] = [];
                teamsMap[item.team].push(item);

                if(item.campaign === 'MLA' && item.status === 'G2G') mlaTotal += item.val;
                if(item.campaign === 'CGM' && item.status === 'G2G') cgmTotal += item.val;
            });

            document.getElementById('totalCgmFloor').innerText = cgmTotal;
            document.getElementById('totalMlaFloor').innerText = mlaTotal;
            document.getElementById('totalFloorCount').innerText = entries.length;

            let gridHtml = "";
            const teamsList = ["Wazowski#1", "Wazowski#2", "Midblue", "Prime", "Mla"];

            teamsList.forEach(tName => {
                let tEntries = teamsMap[tName] || [];
                gridHtml += `
                    <div class="team-column">
                        <div class="team-header">
                            <span>${tName}</span>
                            <span class="team-badge">${tEntries.length} Entries</span>
                        </div>
                `;

                if(tEntries.length === 0) {
                    gridHtml += `<div style="padding: 15px; text-align: center; color: var(--text-muted); font-size: 12px;">No entries for this date</div>`;
                } else {
                    tEntries.forEach(entry => {
                        let statusClass = 'status-g2g';
                        if(entry.status === 'Bad') statusClass = 'status-bad';
                        if(entry.status === 'Postponed') statusClass = 'status-postponed';

                        gridHtml += `
                            <div class="agent-row">
                                <div class="agent-name">${entry.name}</div>
                                <div class="agent-val">${entry.val}</div>
                                <div class="agent-status ${statusClass}">${entry.status}</div>
                            </div>
                        `;
                    });
                }

                gridHtml += `</div>`;
            });

            document.getElementById('floorGridContainer').innerHTML = gridHtml;
        }

        // Initial load
        loadFloorData();
    </script>
</body>
</html>
