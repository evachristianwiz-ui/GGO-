<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Day-to-Day Floor Live</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1800px; margin: 0 auto; }
        
        /* Navbar */
        .main-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 25px;
        }
        .logo-img { height: 40px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: var(--accent);
            color: var(--bg-dark);
        }

        /* Top Header Title: GGO RANKING + Date Bold */
        .ranking-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--accent);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.15);
        }
        .ranking-main-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .ranking-main-title span { color: var(--accent); }
        .current-date-bold {
            font-size: 16px;
            font-weight: bold;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 15px;
        }
        .nav-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .header-kpis {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .kpi-badge {
            background-color: #0f2537;
            border: 2px solid var(--accent);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .kpi-badge.g2g-badge { border-color: var(--success); }
        .kpi-badge span {
            color: var(--text-main);
            font-size: 18px;
            margin-top: 2px;
        }
        .kpi-badge.g2g-badge span { color: var(--success); }

        .btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-accent { background-color: var(--accent); color: var(--bg-dark); }
        .btn-whatsapp { background-color: #25d366; color: white; display: flex; align-items: center; gap: 6px; }
        .btn:hover { opacity: 0.9; }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .team-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .team-name { font-size: 16px; font-weight: bold; color: var(--accent); }
        .team-summary-tag { font-size: 12px; color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 3px 8px; border-radius: 6px; font-weight: bold; }

        /* Strict scroll limitation so footer totals never get covered */
        .agents-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 290px;
            overflow-y: auto;
            padding-right: 6px;
            overflow-x: visible !important;
        }
        .agents-list::-webkit-scrollbar { width: 6px; }
        .agents-list::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

        .agent-row-box {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            position: relative;
        }

        .agent-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .agent-name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #f1f5f9; 
            width: 100px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        
        select.att-select {
            background: #0b192c;
            border: 2px solid var(--card-border);
            font-weight: bold;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: 50px;
            text-align: center;
            outline: none;
        }
        .att-present { color: #34d399 !important; border-color: #10b981 !important; background: rgba(16, 185, 129, 0.12) !important; }
        .att-absent { color: #f87171 !important; border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.12) !important; }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input.count-input {
            background: #0f2537;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 48px;
            padding: 4px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        input.count-input:focus { border-color: var(--accent); outline: none; }

        .breakdown-container {
            position: relative;
        }
        
        .breakdown-btn {
            background: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .breakdown-btn:hover { background: var(--accent); color: var(--bg-dark); }

        .breakdown-popup {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: #0b192c;
            border: 2px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            z-index: 99999;
            width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .breakdown-popup.show {
            display: block;
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .breakdown-row input {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 5px;
            padding: 4px;
            font-size: 12px;
            text-align: center;
            width: 50px;
        }

        .team-footer-totals {
            background: rgba(0, 180, 216, 0.05);
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
        }
        .team-footer-totals span { color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navbar (Updated with Knowledge Base Link) -->
        <div class="main-navbar">
            <div class="logo-area">
                <img src="GGO-White-Var2.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">📊 Dashboard</a>
                <a href="agents.html" class="nav-link">👥 Agents Production</a>
                <a href="floor.html" class="nav-link active">📋 Day-to-Day Floor</a>
                <a href="knowledge.html" class="nav-link">💡 Knowledge Base</a>
            </div>
        </div>

        <!-- Prominent Bold Header: GGO RANKING + Date -->
        <div class="ranking-header-bar">
            <div class="ranking-main-title">🏆 <span>GGO RANKING</span></div>
            <div class="current-date-bold" id="headerDateDisplay">📅 Loading date...</div>
        </div>

        <div class="top-action-bar">
            <div class="nav-title">Day-to-Day Floor Live Tracking</div>
            <div class="header-kpis">
                <div class="kpi-badge">
                    TOTAL TRANSFERS
                    <span id="top-floor-count">0</span>
                </div>
                <div class="kpi-badge g2g-badge">
                    TOTAL G2G
                    <span id="top-g2g-count">0</span>
                </div>
                <button class="btn btn-whatsapp" onclick="copyWhatsAppUpdate()">💬 Copy for WhatsApp</button>
                <button class="btn btn-accent" onclick="saveFloorDataManual()">💾 Save Now</button>
            </div>
        </div>

        <!-- Teams Grid Container -->
        <div class="teams-grid" id="teamsGridContainer"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuddApsA14FoAUMqBGlc1wNlE2T3fEwTM",
            authDomain: "ggo-production-per-agent.firebaseapp.com",
            projectId: "ggo-production-per-agent",
            storageBucket: "ggo-production-per-agent.firebasestorage.app",
            messagingSenderId: "825359557967",
            appId: "1:825359557967:web:8ef2d2a6e2c23bb439913a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const defaultTeamsData = [
            { team: "Wazowski 1", leader: "Mavis Miller", agents: ["Adam", "Rafy", "Victor", "Mia", "Jessy", "Amy"] },
            { team: "Bloom", leader: "Donna Bell", agents: ["Anna", "Heaven", "Katherine", "Maddy", "Celine", "Jules", "Kim", "Jennifer", "Austin", "Grace", "Paris", "Eric"] },
            { team: "Unity", leader: "William White", agents: ["Ray", "Coby", "Scarlett", "Cloe", "Ian", "Jacob"] },
            { team: "PGX", leader: "Jordan Kelly", agents: ["Stewart", "Micheal", "Jeremy", "Daisy", "Diana", "Hannah", "Camila", "Catilyn", "Emma", "Owen"] },
            { team: "MLA", leader: "Ashley & Williams", agents: ["Roben", "Ryan", "Haley", "Nina", "Kai", "Elle", "Monica", "Jennie", "Tia", "Riley"] }
        ];

        let globalAgentsStatus = {};

        function getLocalDateKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateHeaderDate() {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const todayStr = new Date().toLocaleDateString('en-US', options);
            document.getElementById('headerDateDisplay').innerText = `📅 ${todayStr}`;
        }

        onSnapshot(collection(db, "agents_data"), (snapshot) => {
            globalAgentsStatus = {};
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.name && data.team) {
                    const key = `${data.team}_${data.name.trim()}`;
                    globalAgentsStatus[key] = data.status || 'Active';
                }
            });
            renderFloorCards();
        });

        function renderFloorCards() {
            const container = document.getElementById('teamsGridContainer');
            let html = "";

            defaultTeamsData.forEach((t) => {
                const activeAgents = t.agents.filter(agentName => {
                    const key = `${t.team}_${agentName}`;
                    const status = globalAgentsStatus[key];
                    const isTerminatedOrResigned = status === 'Terminated' || status === 'Resigned';
                    return !isTerminatedOrResigned;
                });

                html += `
                <div class="team-card" data-team="${t.team}">
                    <div>
                        <div class="team-header">
                            <div>
                                <div class="team-name">${t.team}</div>
                                <div style="font-size: 11px; color: var(--text-muted);">TL: ${t.leader}</div>
                            </div>
                            <div class="team-summary-tag"><span class="team-g2g-lbl">0</span> G2G</div>
                        </div>
                        <div class="agents-list">`;

                activeAgents.forEach((agentName) => {
                    html += `
                            <div class="agent-row-box" data-agent="${agentName}">
                                <div class="agent-info">
                                    <select class="att-select att-present" onchange="window.updateAttColor(this); window.calculateTotals(); window.autoSave();">
                                        <option value="P" class="att-present" style="color:#10b981; font-weight:bold;">P</option>
                                        <option value="A" class="att-absent" style="color:#ef4444; font-weight:bold;">A</option>
                                    </select>
                                    <span class="agent-name" title="${agentName}">${agentName}</span>
                                </div>
                                <div class="controls-group">
                                    <input type="number" class="count-input agent-total-val" value="0" min="0" oninput="window.updateBreakdown(this); window.calculateTotals(); window.autoSave();" placeholder="0">
                                    
                                    <div class="breakdown-container">
                                        <button class="breakdown-btn" onclick="window.toggleBreakdown(event)" title="Edit Breakdown">⚙️</button>
                                        <div class="breakdown-popup" onclick="event.stopPropagation()">
                                            <div style="font-weight: bold; margin-bottom: 8px; color: var(--accent); font-size: 12px; display:flex; justify-content:space-between; align-items:center;">
                                                <span>Status Breakdown</span>
                                                <span style="cursor:pointer; color:#fff; font-size:14px;" onclick="window.closeBreakdown(this)">✖</span>
                                            </div>
                                            <div class="breakdown-row">
                                                <span>G2G:</span>
                                                <input type="number" class="sub-status-cnt sub-g2g" value="0" min="0" oninput="window.calculateTotals(); window.autoSave();">
                                            </div>
                                            <div class="breakdown-row">
                                                <span>Bad:</span>
                                                <input type="number" class="sub-status-cnt sub-bad" value="0" min="0" oninput="window.calculateTotals(); window.autoSave();">
                                            </div>
                                            <div class="breakdown-row">
                                                <span>Postponed:</span>
                                                <input type="number" class="sub-status-cnt sub-post" value="0" min="0" oninput="window.calculateTotals(); window.autoSave();">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                });

                html += `
                        </div>
                    </div>
                    <div class="team-footer-totals">
                        <div>Attended: <span class="team-att-count">0</span></div>
                        <div>Count: <span class="team-count-val">0</span></div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            loadSavedFloorData();
        }

        window.toggleBreakdown = function(event) {
            event.stopPropagation();
            const popup = event.currentTarget.nextElementSibling;
            const isOpen = popup.classList.contains('show');
            
            document.querySelectorAll('.breakdown-popup').forEach(p => p.classList.remove('show'));
            if (!isOpen) {
                popup.classList.add('show');
            }
        }

        window.closeBreakdown = function(spanEl) {
            spanEl.closest('.breakdown-popup').classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.breakdown-container')) {
                document.querySelectorAll('.breakdown-popup').forEach(p => p.classList.remove('show'));
            }
        });

        window.updateAttColor = function(selectEl) {
            if (selectEl.value === 'P') {
                selectEl.className = "att-select att-present";
            } else {
                selectEl.className = "att-select att-absent";
            }
        }

        window.updateBreakdown = function(inputEl) {
            const val = Number(inputEl.value) || 0;
            const popup = inputEl.parentElement.querySelector('.breakdown-popup');
            const g2gInput = popup.querySelector('.sub-g2g');
            const badInput = popup.querySelector('.sub-bad');
            const postInput = popup.querySelector('.sub-post');

            const currentSubSum = Number(g2gInput.value) + Number(badInput.value) + Number(postInput.value);
            if(currentSubSum === 0 || currentSubSum === Number(g2gInput.value)) {
                g2gInput.value = val;
                badInput.value = 0;
                postInput.value = 0;
            }
        }

        window.calculateTotals = function() {
            let floorCount = 0;
            let floorG2G = 0;

            const teamCards = document.querySelectorAll('.team-card');
            teamCards.forEach(card => {
                let teamAttCount = 0;
                let teamTotalVal = 0;
                let teamG2GVal = 0;

                const agentRows = card.querySelectorAll('.agent-row-box');
                agentRows.forEach(row => {
                    const att = row.querySelector('.att-select').value;
                    if(att === 'P') teamAttCount++;

                    const mainVal = Number(row.querySelector('.agent-total-val').value) || 0;
                    teamTotalVal += mainVal;

                    const g2gVal = Number(row.querySelector('.sub-g2g').value) || 0;
                    teamG2GVal += g2gVal;
                });

                card.querySelector('.team-att-count').innerText = teamAttCount;
                card.querySelector('.team-count-val').innerText = teamTotalVal;
                card.querySelector('.team-g2g-lbl').innerText = teamG2GVal;

                floorCount += teamTotalVal;
                floorG2G += teamG2GVal;
            });

            document.getElementById('top-floor-count').innerText = floorCount;
            document.getElementById('top-g2g-count').innerText = floorG2G;
        }

        let saveTimer = null;
        window.autoSave = function() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveDataToFirebase(true);
            }, 300);
        }

        window.saveFloorDataManual = async function() {
            await saveDataToFirebase(false);
            alert("✅ Floor data successfully saved to cloud!");
        }

        async function saveDataToFirebase(isQuiet) {
            const todayKey = getLocalDateKey();
            let payload = {};

            document.querySelectorAll('.team-card').forEach(card => {
                const teamName = card.getAttribute('data-team');
                card.querySelectorAll('.agent-row-box').forEach(row => {
                    const agentName = row.getAttribute('data-agent');
                    payload[`${teamName}_${agentName}`] = {
                        att: row.querySelector('.att-select').value,
                        total: row.querySelector('.agent-total-val').value,
                        g2g: row.querySelector('.sub-g2g').value,
                        bad: row.querySelector('.sub-bad').value,
                        post: row.querySelector('.sub-post').value
                    };
                });
            });

            try {
                await setDoc(doc(db, "floor_daily", todayKey), { data: payload, updatedAt: new Date() });
            } catch(e) {
                if(!isQuiet) alert("Error saving: " + e.message);
                console.error("Save error: ", e);
            }
        }

        async function loadSavedFloorData() {
            const todayKey = getLocalDateKey();
            try {
                const docSnap = await getDoc(doc(db, "floor_daily", todayKey));
                if (docSnap.exists()) {
                    const saved = docSnap.data().data || {};
                    document.querySelectorAll('.team-card').forEach(card => {
                        const teamName = card.getAttribute('data-team');
                        card.querySelectorAll('.agent-row-box').forEach(row => {
                            const agentName = row.getAttribute('data-agent');
                            const key = `${teamName}_${agentName}`;
                            if(saved[key]) {
                                const selectEl = row.querySelector('.att-select');
                                selectEl.value = saved[key].att || 'P';
                                window.updateAttColor(selectEl);

                                row.querySelector('.agent-total-val').value = saved[key].total || 0;
                                row.querySelector('.sub-g2g').value = saved[key].g2g || 0;
                                row.querySelector('.sub-bad').value = saved[key].bad || 0;
                                row.querySelector('.sub-post').value = saved[key].post || 0;
                            }
                        });
                    });
                    window.calculateTotals();
                } else {
                    window.calculateTotals();
                }
            } catch(e) {
                console.log("No saved sheet found for today yet.");
            }
        }

        window.copyWhatsAppUpdate = function() {
            let totalFloorTransfers = document.getElementById('top-floor-count').innerText;
            let totalFloorG2G = document.getElementById('top-g2g-count').innerText;

            let text = `CGM AT ${totalFloorTransfers}\n\n`;

            const teamCards = document.querySelectorAll('.team-card');
            teamCards.forEach(card => {
                const teamName = card.querySelector('.team-name').innerText.toUpperCase();
                const totalCount = card.querySelector('.team-count-val').innerText;
                
                text += `${teamName} AT ${totalCount}\n`;

                card.querySelectorAll('.agent-row-box').forEach(row => {
                    const agentName = row.querySelector('.agent-name').innerText.toUpperCase();
                    const agentTotal = Number(row.querySelector('.agent-total-val').value) || 0;
                    
                    if (agentTotal > 0) {
                        const g2g = Number(row.querySelector('.sub-g2g').value) || 0;
                        const bad = Number(row.querySelector('.sub-bad').value) || 0;
                        const post = Number(row.querySelector('.sub-post').value) || 0;

                        let details = [];
                        if (g2g > 0) details.push(`${g2g} G2G`);
                        if (bad > 0) details.push(`${bad} BAD`);
                        if (post > 0) details.push(`${post} POSTPONED`);

                        let detailsStr = details.length > 0 ? ` ( ${details.join(' , ')} )` : "";
                        text += `${agentName} AT ${agentTotal}${detailsStr}\n`;
                    }
                });
                text += `\n`;
            });

            text += `TOTAL G2G ${totalFloorG2G}`;

            navigator.clipboard.writeText(text.trim());
            alert("✅ Formatted WhatsApp update copied to clipboard!");
        }

        window.onload = function() {
            updateHeaderDate();
        };
    </script>
</body>
</html>
