<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGO - Login</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0b192c;
            --card-border: #1e3e62;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 16px;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: var(--accent); font-size: 22px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>GGO System Login</h2>
        
        <div class="input-group">
            <label for="passwordInput">Enter Access Password:</label>
            <input type="password" id="passwordInput" placeholder="Password...">
        </div>

        <button class="btn-login" onclick="handleLogin()">Login</button>
        <div id="errorMsg" class="error-msg">Incorrect password. Please try again.</div>
    </div>

    <script>
        function handleLogin() {
            const pass = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // الباسوردات بالظبط زي ما طلبتيها:
            const MANAGER_PASSWORD = "MANAGER00206"; 
            const AGENT_PASSWORD = "agent123";         

            if (pass === MANAGER_PASSWORD) {
                localStorage.setItem('userRole', 'manager');
                window.location.href = 'index.html'; 
            } else if (pass === AGENT_PASSWORD) {
                localStorage.setItem('userRole', 'agent');
                window.location.href = 'index.html'; 
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>

</body>
</html>
